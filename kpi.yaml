# kpi.yaml —— 单一真相源。
#
# 规则：数字只进这里，不复制进 README / 文档正文（状态散多处必漂移）。
# actual 一律为 null，直到 metrics/run_eval.py --live 真跑出来为止。
# dry-run 的数字来自确定性 mock，只验管线，不得填进 actual。

benchmark: 适老化医疗转译（面向银发群体的适老化医嘱解读与个性化健康服务智能推荐）
project_level: 部门级

# --- 数据与切分 ---------------------------------------------------------
data_source: 七个中文医疗爬虫库（bdyd / dxys / mkss / others / xywy / ylys / zsys）
corpus_records: 83730        # 索引后的**逻辑记录**数，非物理行数（见下方 caveats）
split_seed: 20260810         # record_id 级三分切的种子，改动即作废所有下游抽样
split_ratios: {test: 20, verifier_train: 60, reserve: 20}

# --- KPI ----------------------------------------------------------------
metrics:

  - id: kpi1_readability
    name: 适老化转译可读性达标率
    definition: >
      转译后文本中符合小学六年级可读水平的词汇比例（词级微平均）。判定见
      docs/METRIC_SPEC.md：一个计分词达标 iff 在单位白名单、或在常见健康词
      白名单、或（全部汉字 ∈ 课标常用字表一 2500 且不在 jargon 术语集）。
    primary_gauge: strict     # 主口径：课标字表一 2500，医学实体不豁免
    target: 0.90
    also_report: [glossed, lenient]
    determinism: 确定性计算（metrics/readability.py），无 LLM 调用
    actual: null              # 词级微平均，待 --live
    actual_hard_subset: null  # hard 子集（难度=难的 15%）单独报，判别力观测口
    # ⚠️ 原文基线：中位 0.864，其中 83/270（31%）原文已 ≥0.90。
    # 这些题「照抄原文」即通过，对 KPI-1 零区分度。跑数必须同时报净提升与
    # 「原文未达标子集」上的达标率，绝对达标率不得单独引用。见 AUTHORING_SPEC §4d。
    source_baseline_median: 0.864
    source_already_passing: 83
    actual_net_gain: null            # 转译后 − 原文，共同主诊断
    actual_on_headroom_subset: null  # 原文未达标的 187 题上的达标率
    actual_macro_by_scenario: null
    ci95: null
    verdict: null
    command: python3 metrics/run_eval.py --live

  - id: kpi2_scenario_coverage
    name: 适老场景覆盖数
    definition: >
      测试集中有真实 provenance 支撑的子场景数。父类沿用项目书第六栏原文的
      8 类不变，子场景挂靠其下，指标说明一字不改。
    target: 10
    actual_subscenarios: 12      # 超额；配比依据见 docs/AUTHORING_SPEC.md
    allocation_basis: 老年特异子集（43 条 / 频次 4560），非全量日志
    parent_classes:
      理解域: [检验报告解读, 医嘱转译, 用药说明, 健康科普]
      推荐域: [权益匹配, 分科医生, 复诊提醒, 用药干预]
    actual: 12
    command: python3 pipeline/validate_testset.py

  - id: guard_faithfulness
    name: 忠实性通过率（守门指标，非项目书 KPI）
    definition: >
      判官判定 faithful_overall 且 negative_rubric 无 any-violated。
      防止可读性靠歪曲或删减原文换取。
    judge: Claude Sonnet 5（session subagent；异厂解耦，判官厂商 != 被测厂商）
    reproducibility: 可审计不可复现 —— 逐条留痕 judge_runs/<run_id>.jsonl
    actual: null
    ci95: null

# --- 被测系统 -----------------------------------------------------------
system_under_test:
  model: deepseek-v4-flash    # 已核实存在（该 key 上另有 deepseek-v4-pro）
  note: deepseek-chat 已不在该 key 的模型列表，勿照抄旧项目配置

# --- 诚实披露 -----------------------------------------------------------
caveats:
  - 口径: 可读性 = 词级微平均达标率（strict）；覆盖 = 有真实 case 的子场景数。
  - 语料规模: >
      83730 是 csv 逻辑记录数。多个文件的字段内含换行，按物理行数会严重高估
      （bdyd/疾病 物理 651924 行，实为 4273 条记录）。凡引用规模一律用记录数。
  - 判官: >
      忠实性判官是 session 内的 Claude，无可钉版本的 API model id，**可审计但
      不可复现**，重跑会漂。可读性 KPI 是确定性计算，不受此影响。
  - 词表: >
      字级用官方课标字表，词级用 GF 0025-2021；但国内唯一官方「词→年级」标准
      《义务教育常用词表（草案）》无公开机读版，当前实现是官方字级+官方词级量表
      的组合，尚不是词级年级标准本身。jargon.txt 是唯一非官方词表。
  - 数据缺口: >
      医嘱转译无真实语料（全盘无真实医嘱单/处方笺/出院小结），只能用疾病库
      「治疗/就医」字段模拟，对外表述为「治疗方案转译」，不得称真实医嘱。
      权益匹配已在 live-003 移除医保布尔位字段（人工决定，见 ticket 08 追加一）——
      「权益匹配医保侧只有布尔位」这条历史披露不再适用于当前冻结集。
  - 忠实性判据（用药类场景）: >
      guard_faithfulness 对用药咨询/用药干预的低分，多数来自模型编造无原文依据的
      用药/急救指令（如「低血糖吃糖」），按判据一律判违规——不论该指令是否医学上
      恰好正确。这是刻意设计（判官不具备逐案核实患者全药单交互安全的能力，
      `用药干预-009` 实测过"编对"和"编错"外观完全一样），不是判官矫枉过正；
      细节与 live-003 的具体反例见 ticket 08 追加二。
  - 历史判定修正: >
      **12 个场景（除权益匹配外的全部）已于 2026-08-13 完整复核，排查完毕。**
      原因是判官早期版本对"无原文依据的补充"没有按"动作指令 vs 信息性内容"
      分级，哪怕补充准确也笼统判违规。用药咨询 6/19→8/19、用药干预 9/20→
      10/20、科普辟谣 8/15→11/15、饮食营养 20/35→21/35、运动与养生 16/24
      不变、医嘱转译 9/15→10/15、分科导诊 13/18 不变、复诊与随访 14/17 不变、
      日常照护 39/47→41/47、急症处置 19/21 不变、检验报告解读 22/24 不变。
      **guard_faithfulness 68.9%→72.6%（连同权益匹配的数据缺陷修复，从
      live-002 的 64.8% 起算）。** 方法见 ticket 08 追加三～十：①先诊断异常
      子集的根因，②给"无源头补充"按动作指令/信息性分级而非按"这次准不准"
      分级，③人在环批量定则+独立模型盲测复现，④按"编多了 vs 说少了"给场景
      分诊筛选复核范围（12/12 场景验证 0 反例）。⚠ 并非所有"看着像补充了
      准确内容"都真的准确——复诊与随访-007、日常照护-014 两条最初判断像是
      历史误判，独立验证后证实原判是对的（内容不准确/证据不足），每一条都
      必须过外部核实，不能凭直觉放行。同一套方法论已整理进
      `agent-experiment-discipline` skill §⑧（disciplines.md 纪律 49–52）。

